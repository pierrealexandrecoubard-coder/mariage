<style>
:root {
  --cream:#F5F0E8; --cream-dark:#EDE5D5;
  --brown:#6B4C2A; --brown-light:#9B7A52; --brown-dark:#3D2B15;
  --taupe:#C4B09A; --ink:#2C1F12; --white:#FDFAF5;
  --green:#4a7c59; --red:#9b3a3a;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'EB Garamond',Georgia,serif;background:var(--cream-dark);color:var(--ink);line-height:1.6;min-height:100vh;}

/* LOGIN */
#admin-login{position:fixed;inset:0;z-index:999;background:var(--ink);display:flex;align-items:center;justify-content:center;padding:2rem;}
.al-box{max-width:380px;width:100%;text-align:center;}
.al-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;color:var(--cream);margin-bottom:.25rem;}
.al-sub{font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-bottom:2rem;}
.al-input{width:100%;background:rgba(255,255,255,.08);border:none;border-bottom:1px solid var(--taupe);padding:.65rem 0;font-family:'EB Garamond',serif;font-size:1rem;color:var(--cream);text-align:center;outline:none;margin-bottom:1rem;}
.al-btn{display:block;width:100%;padding:.8rem;background:var(--brown);color:var(--cream);border:none;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;}
.al-btn:hover{background:var(--brown-dark);}
.al-err{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.9rem;color:#e07070;margin-top:.75rem;min-height:1.2rem;}

/* ADMIN UI */
#admin-ui{display:none;min-height:100vh;}
#admin-ui.visible{display:block;}

header{background:var(--ink);padding:1rem 2rem;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1rem;}
.header-title{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.5rem;color:var(--cream);}
.header-sub{font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-top:2px;}
.header-actions{display:flex;gap:.75rem;align-items:center;}
.btn{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:.5rem 1.25rem;border:none;cursor:pointer;transition:background .2s;}
.btn-primary{background:var(--brown);color:var(--cream);}
.btn-primary:hover{background:var(--brown-dark);}
.btn-ghost{background:rgba(255,255,255,.08);color:var(--taupe);border:1px solid rgba(196,176,154,.3);}
.btn-ghost:hover{background:rgba(255,255,255,.15);color:var(--cream);}
.btn-danger{background:rgba(155,58,58,.2);color:#e07070;border:1px solid rgba(155,58,58,.3);}
.btn-danger:hover{background:rgba(155,58,58,.35);}
.btn-sm{padding:.3rem .85rem;font-size:9px;}

main{padding:2rem;max-width:1100px;margin:0 auto;}

/* STATS */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:1rem;margin-bottom:2rem;}
.stat-card{background:var(--white);border:1px solid rgba(196,176,154,.4);padding:1.25rem;text-align:center;}
.stat-num{font-family:'Cormorant Garamond',serif;font-size:2.2rem;font-weight:300;color:var(--brown);line-height:1;}
.stat-lbl{font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe);margin-top:.3rem;}

/* TABLE */
.table-wrap{background:var(--white);border:1px solid rgba(196,176,154,.4);overflow-x:auto;}
.table-toolbar{padding:1rem 1.5rem;border-bottom:1px solid rgba(196,176,154,.3);display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;}
.table-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;color:var(--ink);}
.search-input{border:none;border-bottom:1px solid var(--taupe);background:transparent;padding:.35rem 0;font-family:'EB Garamond',serif;font-size:.95rem;color:var(--ink);outline:none;width:220px;}
table{width:100%;border-collapse:collapse;font-size:.9rem;}
thead tr{border-bottom:1px solid rgba(196,176,154,.4);}
th{font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--taupe);padding:.75rem 1rem;text-align:left;white-space:nowrap;}
td{padding:.75rem 1rem;border-bottom:1px solid rgba(196,176,154,.15);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
tr:hover td{background:rgba(245,240,232,.5);}
.code-badge{font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.1em;background:var(--cream-dark);padding:.2rem .6rem;color:var(--brown);}
.etape-pill{display:inline-block;font-family:'Raleway',sans-serif;font-size:8px;letter-spacing:.08em;text-transform:uppercase;padding:.15rem .5rem;margin:.1rem .1rem 0 0;background:rgba(107,76,42,.1);color:var(--brown);border:1px solid rgba(107,76,42,.2);}
.etape-pill.dim{opacity:.35;}
.actions{display:flex;gap:.4rem;white-space:nowrap;}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(44,31,18,.7);z-index:500;display:flex;align-items:center;justify-content:center;padding:1rem;}
.modal-overlay.hidden{display:none;}
.modal{background:var(--white);max-width:520px;width:100%;padding:2rem;position:relative;max-height:90vh;overflow-y:auto;}
.modal-title{font-family:'Cormorant Garamond',serif;font-size:1.6rem;color:var(--ink);margin-bottom:1.5rem;}
.field{margin-bottom:1.25rem;}
.field label{display:block;font-family:'Raleway',sans-serif;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--brown-light);margin-bottom:.4rem;}
.field input{width:100%;border:none;border-bottom:1px solid var(--taupe);background:transparent;padding:.4rem 0;font-family:'EB Garamond',serif;font-size:1rem;color:var(--ink);outline:none;}
.field input:focus{border-color:var(--brown);}
.etapes-checks{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-top:.3rem;}
.etape-row{display:flex;align-items:center;gap:.5rem;font-family:'EB Garamond',serif;font-size:.95rem;cursor:pointer;}
.modal-footer{display:flex;justify-content:flex-end;gap:.75rem;margin-top:1.75rem;padding-top:1.25rem;border-top:1px solid rgba(196,176,154,.3);}
.modal-close{position:absolute;top:1rem;right:1rem;background:none;border:none;font-size:1.2rem;cursor:pointer;color:var(--taupe);}

/* EXPORT */
.export-box{background:var(--ink);padding:1.5rem;margin-top:2rem;}
.export-title{font-family:'Raleway',sans-serif;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--taupe);margin-bottom:.75rem;}
textarea.export-textarea{width:100%;background:rgba(255,255,255,.05);border:1px solid rgba(196,176,154,.2);color:var(--cream);font-family:monospace;font-size:12px;padding:.75rem;resize:vertical;min-height:160px;outline:none;}

/* TOAST */
.toast{position:fixed;bottom:1.5rem;right:1.5rem;background:var(--brown);color:var(--cream);font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.1em;padding:.75rem 1.25rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:999;}
.toast.show{opacity:1;}
</style>

<div id="admin-login">

    <div class="al-sub">Léa & Pierre-Alexandre · 2027</div>

    <div class="al-err" id="adminErr"></div>
  </div>
</div>

<!-- ADMIN UI -->
<div id="admin-ui">
  <header>
    <div>
      <div class="header-title">Gestion des invités</div>
      <div class="header-sub">Mariage Léa & Pierre-Alexandre · 14 août 2027</div>
    </div>
    <div class="header-actions">
      <button class="btn btn-primary" onclick="openModal()">+ Nouvel invité</button>
      <button class="btn btn-ghost" onclick="adminLogout()">Déconnexion</button>
    </div>
  </header>

  <main>
    <!-- STATS -->
    <div class="stats" id="statsRow"></div>

    <!-- TABLE -->
    <div class="table-wrap">
      <div class="table-toolbar">
        <span class="table-title">Liste des invités</span>
        <input class="search-input" id="searchInput" placeholder="Rechercher un invité…" oninput="renderTable()">
      </div>
      <table>
        <thead>
          <tr>
            <th>Nom / Famille</th>
            <th>Code d'accès</th>
            <th>Étapes invitées</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="guestTableBody"></tbody>
      </table>
    </div>

    <!-- EXPORT -->
    <div class="export-box">
      <div class="export-title">Export — Copier dans le site principal (bloc GUESTS)</div>
      <textarea class="export-textarea" id="exportArea" readonly></textarea>
      <button class="btn btn-ghost btn-sm" style="margin-top:.75rem;" onclick="copyExport()">Copier le code</button>
    </div>
  </main>
</div>

<!-- MODAL ADD/EDIT -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="if(event.target===this) closeModal()">
  <div class="modal">
    <button class="modal-close" onclick="closeModal()">✕</button>
    <div class="modal-title" id="modalTitle">Nouvel invité</div>

    <div class="field">
      <label>Nom / Famille</label>
      <input type="text" id="mNom" placeholder="Ex : Famille Dupont">
    </div>
    <div class="field">
      <label>Code d'accès (majuscules, sans espaces)</label>
      <input type="text" id="mCode" placeholder="Ex : DUPONT2027" oninput="this.value=this.value.toUpperCase().replace(/\s/g,'')">
    </div>
    <div class="field">
      <label>Étapes auxquelles cet invité est convié</label>
      <div class="etapes-checks">
        <label class="etape-row"><input type="checkbox" id="chk-vendredi" value="vendredi"> Vendredi soir</label>
        <label class="etape-row"><input type="checkbox" id="chk-eglise" value="eglise" checked> Cérémonie église</label>
        <label class="etape-row"><input type="checkbox" id="chk-cocktail" value="cocktail" checked> Cocktail & Dîner</label>
        <label class="etape-row"><input type="checkbox" id="chk-brunch" value="brunch"> Brunch</label>
      </div>
    </div>

    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveGuest()">Enregistrer</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

// ===== ADMIN AUTH =====
function adminLogin() {
  var pw = document.getElementById('adminPwInput').value;
  if (pw === ADMIN_PASSWORD) {
    document.getElementById('admin-login').style.display = 'none';
    document.getElementById('admin-ui').classList.add('visible');
    render();
  } else {
    document.getElementById('adminErr').textContent = "Mot de passe incorrect.";
  }
}
function adminLogout() {
  document.getElementById('admin-ui').classList.remove('visible');
  document.getElementById('admin-login').style.display = 'flex';
  document.getElementById('adminPwInput').value = '';
}

// ===== RENDER =====
function render() { renderStats(); renderTable(); renderExport(); }

function renderStats() {
  var total = Object.keys(guests).length;
  var counts = {vendredi:0, eglise:0, cocktail:0, brunch:0};
  Object.values(guests).forEach(function(g) {
    g.etapes.forEach(function(e) { if(counts[e]!==undefined) counts[e]++; });
  });
  var el = document.getElementById('statsRow');
  el.innerHTML =
    stat(total, 'Total invités') +
    stat(counts.vendredi, 'Vendredi soir') +
    stat(counts.eglise, 'Cérémonie') +
    stat(counts.cocktail, 'Cocktail / Dîner') +
    stat(counts.brunch, 'Brunch');
}
function stat(n, l) { return '<div class="stat-card"><div class="stat-num">'+n+'</div><div class="stat-lbl">'+l+'</div></div>'; }

function renderTable() {
  var q = (document.getElementById('searchInput').value || '').toLowerCase();
  var tbody = document.getElementById('guestTableBody');
  tbody.innerHTML = '';
  Object.keys(guests).sort().forEach(function(code) {
    var g = guests[code];
    if (q && g.nom.toLowerCase().indexOf(q) === -1 && code.toLowerCase().indexOf(q) === -1) return;
    var pills = ETAPES_ALL.map(function(e) {
      var has = g.etapes.indexOf(e) !== -1;
      return '<span class="etape-pill'+(has?'':' dim')+'">'+ETAPES_LABELS[e]+'</span>';
    }).join('');
    var tr = document.createElement('tr');
    tr.innerHTML =
      '<td><strong>'+esc(g.nom)+'</strong></td>' +
      '<td><span class="code-badge">'+esc(code)+'</span></td>' +
      '<td>'+pills+'</td>' +
      '<td><div class="actions">' +
        '<button class="btn btn-ghost btn-sm" onclick="editGuest(\''+esc(code)+'\')">Modifier</button>' +
        '<button class="btn btn-danger btn-sm" onclick="deleteGuest(\''+esc(code)+'\')">Supprimer</button>' +
      '</div></td>';
    tbody.appendChild(tr);
  });
  if (!tbody.innerHTML) tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;color:var(--taupe);padding:2rem;font-style:italic;">Aucun invité trouvé.</td></tr>';
}

function renderExport() {
  var lines = Object.keys(guests).sort().map(function(code) {
    var g = guests[code];
    var etapesStr = g.etapes.map(function(e){return'"'+e+'"';}).join(',');
    return '  "'+code+'": { nom: "'+g.nom.replace(/"/g,'\\"')+'", etapes: ['+etapesStr+'] }';
  });
  document.getElementById('exportArea').value = 'var GUESTS = {\n' + lines.join(',\n') + '\n};';
}

// ===== MODAL =====
function openModal(code) {
  editingCode = code || null;
  document.getElementById('modalTitle').textContent = code ? 'Modifier un invité' : 'Nouvel invité';
  if (code) {
    var g = guests[code];
    document.getElementById('mNom').value = g.nom;
    document.getElementById('mCode').value = code;
    document.getElementById('mCode').disabled = true;
    ETAPES_ALL.forEach(function(e) {
      document.getElementById('chk-'+e).checked = g.etapes.indexOf(e) !== -1;
    });
  } else {
    document.getElementById('mNom').value = '';
    document.getElementById('mCode').value = '';
    document.getElementById('mCode').disabled = false;
    document.getElementById('chk-vendredi').checked = false;
    document.getElementById('chk-eglise').checked = true;
    document.getElementById('chk-cocktail').checked = true;
    document.getElementById('chk-brunch').checked = false;
  }
  document.getElementById('modalOverlay').classList.remove('hidden');
  document.getElementById('mNom').focus();
}
function editGuest(code) { openModal(code); }
function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

function saveGuest() {
  var nom = document.getElementById('mNom').value.trim();
  var code = document.getElementById('mCode').value.trim().toUpperCase();
  if (!nom || !code) { alert('Nom et code sont obligatoires.'); return; }
  if (!editingCode && guests[code]) { alert('Ce code existe déjà. Choisissez-en un autre.'); return; }
  var etapes = ETAPES_ALL.filter(function(e) { return document.getElementById('chk-'+e).checked; });
  if (!etapes.length) { alert('Cochez au moins une étape.'); return; }
  guests[code] = { nom: nom, etapes: etapes };
  closeModal();
  render();
  showToast(editingCode ? 'Invité mis à jour' : 'Invité ajouté');
}

function deleteGuest(code) {
  if (!confirm('Supprimer "'+guests[code].nom+'" ('+code+') ?')) return;
  delete guests[code];
  render();
  showToast('Invité supprimé');
}

// ===== HELPERS =====
function copyExport() {
  var ta = document.getElementById('exportArea');
  ta.select();
  document.execCommand('copy');
  showToast('Code copié dans le presse-papier !');
}
function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
</script>
</body>
</html>
